name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: just web-deps
      - run: just fmt-check
      - run: just lint
      - run: just check
      - run: just test
      - run: just build

  integration:
    name: Boot test under QEMU (Linux, KVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 qemu-utils ovmf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just test-integration

  ui:
    name: Web UI in headless Chrome (Linux, KVM)
    runs-on: ubuntu-latest
    env:
      # Ubuntu's chromium package is only a snap wrapper, so use the Chrome the runner image ships.
      PMHV_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 qemu-utils ovmf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: just web-deps
      - run: just test-ui

  generated:
    name: Generated API client is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v4
      - run: just web-deps
      - run: just generate
      - run: git diff --exit-code

  licences:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
