[package]
name = "pmhv-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pmhv-driver = { version = "0.1.0", path = "../pmhv-driver" }
pmhv-model = { version = "0.1.0", path = "../pmhv-model" }
pmhv-qemu = { version = "0.1.0", path = "../pmhv-qemu" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "process", "time", "signal", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
