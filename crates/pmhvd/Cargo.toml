[package]
name = "pmhvd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures-util = "0.3.34"
pmhv-driver = { version = "0.1.0", path = "../pmhv-driver" }
pmhv-model = { version = "0.1.0", path = "../pmhv-model" }
pmhv-qemu = { version = "0.1.0", path = "../pmhv-qemu" }
rand = "0.10.3"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process", "io-util", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
